[workspace]
members = [
    "core",
    "app",
    "infra",
    "web",
    "cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Skovens"]
description = "Rip, manage, move media files"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP
axum = { version = "0.7", features = ["macros"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "rustls-native-certs"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "timeout"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }

# Hashing
sha2 = "0.10"

# CLI
clap = { version = "4", features = ["derive"] }

# Retry
backon = { version = "1", features = ["tokio"] }

# Testing
proptest = "1"
wiremock = "0.5"
assert_cmd = "2"
predicates = "3"
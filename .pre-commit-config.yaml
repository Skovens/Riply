# Pre-commit hooks for Riply
# Runs before each commit to catch issues early.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && go fmt ./...'
        language: system
        pass_filenames: false
        types: [go]

      - id: go-vet
        name: go vet
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && go vet ./...'
        language: system
        pass_filenames: false
        types: [go]

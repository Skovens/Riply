# cargo-deny configuration for Riply
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisabilities]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
workspace-dependencies = true

[licenses]
# Allow common open-source licenses
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

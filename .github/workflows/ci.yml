name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # Coverage floor: baseline 70.0% (2026-11-25, issue #103). Raise the
      # floor as coverage improves; never lower it.
      - run: go test -race -coverprofile=coverage.out ./...
      - run: |
          go tool cover -func=coverage.out | tee coverage.txt
          total=$(grep -oE '[0-9]+\.[0-9]+%$' coverage.txt | tail -1 | tr -d '%')
          floor=65.0
          awk -v t="$total" -v f="$floor" 'BEGIN { if (t+0 < f+0) { print "coverage " t "% is below the " f "% floor"; exit 1 } print "coverage " t "% >= " f "% floor" }'

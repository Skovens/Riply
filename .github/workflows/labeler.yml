name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
